name: Feature request
description: Предложить новую возможность или улучшение для Hackerspace Ops
title: "[Feature]: "
labels:
  - "feature"
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за предложение!

        Опишите, что нужно сделать и зачем это нужно.
        Не обязательно знать, как это реализовать технически —
        решение определят разработчики или AI-агент.

  - type: textarea
    id: problem
    attributes:
      label: Проблема
      description: |
        Какую проблему или неудобство нужно решить?
        Что сейчас приходится делать вручную или что невозможно сделать?
      placeholder: |
        Например:
        Сейчас анонс мероприятия приходится отдельно публиковать
        на сайте, в Telegram и добавлять в календарь.
    validations:
      required: true

  - type: textarea
    id: desired_result
    attributes:
      label: Желаемый результат
      description: |
        Что должно стать возможным после реализации?
        Опишите результат с точки зрения пользователя.
      placeholder: |
        Например:
        После подтверждения мероприятия бот должен подготовить
        публикации для сайта и Telegram и создать событие в календаре.
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: Сценарий использования
      description: |
        Опишите типичный сценарий: кто, что делает и какой результат ожидает.
      placeholder: |
        Например:
        1. Организатор пишет информацию о мероприятии в чат.
        2. Авторизованный резидент подтверждает публикацию.
        3. Бот создаёт необходимые материалы.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Критерии готовности
      description: |
        По каким наблюдаемым признакам можно понять, что задача выполнена?
        Старайтесь описывать результат, а не способ реализации.
      placeholder: |
        Например:
        - На сайте появился анонс мероприятия.
        - В Telegram опубликован пост с теми же датой и временем.
        - В календаре создано событие.
        - Перед публикацией резидент может проверить результат.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Ограничения и важные условия
      description: |
        Укажите правила, ограничения или особые случаи, которые важно учесть.
        Если их нет — оставьте поле пустым.
      placeholder: |
        Например:
        - Публиковать может только авторизованный пользователь.
        - Ничего не публиковать без подтверждения.
        - Дата и время должны быть одинаковыми во всех каналах.
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Примеры и материалы
      description: |
        Добавьте ссылки, скриншоты, примеры сообщений,
        похожие решения или другие полезные материалы.
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Насколько это важно?
      description: Это помогает команде понять влияние задачи, но не определяет окончательный приоритет.
      options:
        - Небольшое улучшение
        - Полезно для нескольких резидентов
        - Полезно для большинства резидентов
        - Существенно мешает текущей работе
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Перед отправкой
      options:
        - label: Я проверил(а), что похожего feature request ещё нет
          required: true
        - label: Я описал(а) желаемый результат, а не только техническое решение
          required: true